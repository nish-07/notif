name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the build can attach the APK to a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk payment-timer.apk

      - name: Keep a copy in the run
        uses: actions/upload-artifact@v4
        with:
          name: payment-timer-apk
          path: payment-timer.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Payment timer demo ${{ github.run_number }}
          files: payment-timer.apk
